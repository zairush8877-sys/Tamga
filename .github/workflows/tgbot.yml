name: Телеграм-бот меню

# Сервера у сайта нет, поэтому бота держим здесь: раз в несколько минут
# GitHub забирает новые сообщения у Telegram, вносит правки и публикует сайт.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgbot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Забрать сообщения и внести правки
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMINS: ${{ secrets.TG_ADMINS }}
        run: node scripts/tgbot-poll.mjs

      - name: Закоммитить правки
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "правок нет"
            exit 0
          fi
          git config user.name  "Тамга-бот"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Меню: правка из телеграма"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Пуш от робота не запускает другие workflow сам по себе — публикуем явно
  publish:
    needs: poll
    if: needs.poll.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
