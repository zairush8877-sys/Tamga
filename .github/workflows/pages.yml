name: Deploy site to GitHub Pages

# Автозапуск включим, когда Pages будет создан в настройках репозитория —
# до этого каждый push только краснит PR.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Пропускаем промежуточные запуски, но не отменяем уже идущий деплой
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Сайт Pages создаётся один раз вручную: Settings → Pages → Source:
      # GitHub Actions. Токену Actions API создания сайта недоступен
      # ("Resource not accessible by integration"), поэтому без enablement.
      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Собрать артефакт из корня репозитория
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
