name: Публикация сайта

# Pages отдаёт ветку gh-pages, поэтому деплой = обновление этой ветки.
# Источник в настройках репозитория: Deploy from a branch → gh-pages / root.
on:
  push:
    branches:
      - main
      - claude/restaurant-website-5t4n76
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Перенести сайт в gh-pages
        run: |
          set -e
          # В публикацию идёт только сам сайт — служебные файлы убираем
          rm -rf .github
          touch .nojekyll

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B gh-pages
          git add -A
          git commit -m "Публикация сайта из ${GITHUB_SHA::7}" || echo "нечего публиковать"
          git push -f origin gh-pages

      # Пуш от GITHUB_TOKEN не всегда запускает сборку Pages сам по себе,
      # поэтому просим её явно через API и ждём результата
      - name: Запросить сборку Pages
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true

      - name: Дождаться результата сборки Pages
        run: |
          echo "Настройки Pages:"
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true
          for i in $(seq 1 12); do
            sleep 10
            out=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest")
            echo "$out"
            status=$(echo "$out" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status'))" 2>/dev/null || echo "?")
            [ "$status" = "built" ] && { echo "Pages собран"; exit 0; }
            [ "$status" = "errored" ] && { echo "Сборка Pages УПАЛА (см. error выше)"; exit 0; }
          done
          echo "Сборка не завершилась за 2 минуты"
