name: Deploy site to GitHub Pages

# Пока Pages не включён в настройках репозитория, автозапуск отключён —
# иначе каждый push краснит PR. Включите Pages (Settings → Pages →
# Source: GitHub Actions) и верните сюда блок push с нужными ветками.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Пропускаем промежуточные запуски, но не отменяем уже идущий деплой
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Собрать артефакт из корня репозитория
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
