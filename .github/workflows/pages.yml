name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/restaurant-website-5t4n76
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Пропускаем промежуточные запуски, но не отменяем уже идущий деплой
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Настроить Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Собрать артефакт из корня репозитория
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
